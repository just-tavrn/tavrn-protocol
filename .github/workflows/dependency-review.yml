# SPDX-License-Identifier: Apache-2.0
#
# Reviews dependency changes of pull requests (licenses and known vulnerabilities). The package has no
# dependencies today; this keeps it that way unless a change is reviewed. Gated by CI_ENABLED (docs/GITHUB.md).
name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    # Private repositories get the dependency graph only with Advanced Security: the job waits for publication.
    if: ${{ vars.CI_ENABLED == 'true' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, CC-BY-4.0, MPL-2.0, Unlicense, BlueOak-1.0.0
